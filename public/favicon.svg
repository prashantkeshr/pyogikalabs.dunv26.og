<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0e1326"/>
    </radialGradient>
    <radialGradient id="nuc" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-nuc" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- Soft ambient glow at centre -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>

  <!-- Orbital ring 1 — horizontal plane -->
  <ellipse cx="32" cy="32" rx="27" ry="8"
    fill="none" stroke="#fb923c" stroke-width="1.6" opacity="0.78"/>

  <!-- Orbital ring 2 — rotated 60° -->
  <ellipse cx="32" cy="32" rx="27" ry="8"
    fill="none" stroke="#fb923c" stroke-width="1.6" opacity="0.78"
    transform="rotate(60 32 32)"/>

  <!-- Orbital ring 3 — rotated -60° -->
  <ellipse cx="32" cy="32" rx="27" ry="8"
    fill="none" stroke="#fb923c" stroke-width="1.6" opacity="0.78"
    transform="rotate(-60 32 32)"/>

  <!--
    Electron positions — rightmost point of each orbit:
    Ring 1 (0°):   (32+27, 32)   = (59.0, 32.0)
    Ring 2 (+60°): rotate (27,0) by 60° → (13.5, 23.4) → (45.5, 55.4)
    Ring 3 (-60°): rotate (27,0) by -60° → (13.5,-23.4) → (45.5,  8.6)
  -->
  <circle cx="59.0" cy="32.0" r="2.8" fill="#60a5fa" opacity="0.95"/>
  <circle cx="45.5" cy="55.4" r="2.8" fill="#60a5fa" opacity="0.95"/>
  <circle cx="45.5" cy="8.6"  r="2.8" fill="#60a5fa" opacity="0.95"/>

  <!-- Nucleus (glow + core) -->
  <circle cx="32" cy="32" r="7" fill="url(#nuc)" filter="url(#f-nuc)"/>

  <!-- Nucleus specular highlight -->
  <circle cx="29.5" cy="29" r="2.4" fill="white" opacity="0.22"/>
</svg>
