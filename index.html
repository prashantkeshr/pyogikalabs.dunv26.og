<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & theme -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0e1326" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Prayogika — Free Interactive Science Labs</title>

    <meta name="keywords" content="interactive science labs, virtual labs, physics simulation, chemistry lab, biology lab, math visualization, CBSE labs, JEE preparation, NEET biology, IGCSE science, 3D molecular viewer, pendulum simulation, wave interference, orbital mechanics, DNA helix, periodic table, free online labs, prayogika" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Prayogika Labs" />
    <link rel="canonical" href="https://prayogikalabs.dhurta.org/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prayogika Labs" />
    <meta property="og:title" content="Prayogika — Free Interactive Science Labs" />
    <meta property="og:description" content="Explore 17+ interactive 3D science labs for Physics, Biology, Chemistry, and Mathematics — free, no login, designed for CBSE, JEE, NEET, IGCSE and IB students." />
    <meta property="og:url" content="https://prayogikalabs.dhurta.org/" />
    <meta property="og:image" content="https://prayogikalabs.dhurta.org/favicon.svg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Prayogika — Free Interactive Science Labs" />
    <meta name="twitter:description" content="17+ free interactive 3D science simulations for CBSE, JEE, NEET, IGCSE, IB. Physics, Biology, Chemistry, Math — no login needed." />
    <meta name="twitter:image" content="https://prayogikalabs.dhurta.org/favicon.svg" />

    <!-- JSON-LD: WebApplication structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Prayogika Labs",
      "url": "https://prayogikalabs.dhurta.org/",
      "description": "Free interactive science labs for Physics, Biology, Chemistry, and Mathematics — CBSE, JEE, NEET, IGCSE, IB students.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "educationalLevel": ["Secondary Education", "Higher Secondary Education"],
      "inLanguage": "en",
      "keywords": "interactive science labs, physics simulation, chemistry lab, virtual experiments, CBSE, JEE, NEET, IGCSE, IB"
    }
    </script>

    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function() {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          var url = new URL(redirect);
          if (url.pathname !== '/') {
            window.history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
